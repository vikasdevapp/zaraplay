# Single catch-all server block for the bare Elastic IP. Once the three subdomains
# (website / admin / agent) are pointed here, replace `server_name _;` below with
# `server_name website.example.com admin.example.com agent.example.com;` — all three can
# keep sharing this one block since /admin and /agent are just routes in the same Next.js
# app, not separate deployments. Run certbot --nginx afterwards to add HTTPS per domain.

upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
