# zaraplays.com (players + admin) and backend.zaraplays.com (Agent Desk) over HTTPS.
# Certificates come from Let's Encrypt: scripts/deploy.sh issues / expands them (into
# ./certbot/conf) and the certbot service renews them. Both hosts serve the same Next.js app;
# the backend host only exposes the agent routes.

upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:4000;
}

# Where plain-HTTP requests for each host belong.
map $host $https_host {
    backend.zaraplays.com backend.zaraplays.com;
    default               zaraplays.com;
}

# Plain HTTP (any host or the bare IP): answer Let's Encrypt challenges, send everything else
# to HTTPS on the right host.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$https_host$request_uri;
    }
}

# https://www.zaraplays.com (and HTTPS on the bare IP) -> https://zaraplays.com
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/zaraplays.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaraplays.com/privkey.pem;

    return 301 https://zaraplays.com$request_uri;
}

# Players and admins.
server {
    listen 443 ssl;
    http2 on;
    server_name zaraplays.com;

    ssl_certificate /etc/letsencrypt/live/zaraplays.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaraplays.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # The Agent Desk lives on its own host.
    location ^~ /agent {
        return 301 https://backend.zaraplays.com$request_uri;
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Agent Desk.
server {
    listen 443 ssl;
    http2 on;
    server_name backend.zaraplays.com;

    ssl_certificate /etc/letsencrypt/live/zaraplays.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaraplays.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # Opening the host goes straight to the desk (which sends signed-out visitors to /login).
    location = / {
        return 302 /agent;
    }

    # The desk has its own role-locked sign-in.
    location = /login {
        return 302 /agent/login;
    }

    # Player and admin pages belong on the main site.
    location ~ ^/(dashboard|wallet|games|rewards|marketplace|leaderboard|profile|support|verify-phone|signup|admin)(/|$) {
        return 302 https://zaraplays.com$request_uri;
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
    }

    # /agent/*, /login, /forgot-password and the app's static assets.
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
