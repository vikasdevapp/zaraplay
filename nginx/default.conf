# zaraplays.com over HTTPS. Certificates come from Let's Encrypt: scripts/deploy.sh issues
# them on first run (into ./certbot/conf) and the certbot service renews them. /admin and
# /agent are routes in the same Next.js app, so one server block serves everything.

upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:4000;
}

# Plain HTTP (domain, www or bare IP): answer Let's Encrypt challenges, send everything else
# to the canonical https://zaraplays.com.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://zaraplays.com$request_uri;
    }
}

# https://www.zaraplays.com (and HTTPS on the bare IP) -> https://zaraplays.com
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/zaraplays.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaraplays.com/privkey.pem;

    return 301 https://zaraplays.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name zaraplays.com;

    ssl_certificate /etc/letsencrypt/live/zaraplays.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaraplays.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
